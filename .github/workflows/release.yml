name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Cache resolved packages
        uses: actions/cache@v4
        with:
          path: .derived/SourcePackages
          key: spm-${{ hashFiles('OpenBeam.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-

      - name: Build DMG and update archive
        run: ./scripts/build-dmg.sh

      - name: Sign the update and generate the appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: ./scripts/make-appcast.sh "${GITHUB_REF_NAME#v}"

      - name: Upload the appcast for the Pages deploy
        uses: actions/upload-artifact@v4
        with:
          name: appcast
          path: build/appcast/appcast.xml
          retention-days: 1

      # The feed is tracked, so that a later docs-only deploy publishes this
      # release rather than whatever it can fetch back from the live site. The
      # deploy below does not wait for this commit — it takes the artifact
      # directly — so a failure here delays the next deploy's feed, not this
      # release's.
      - name: Record the appcast in the repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --quiet origin main
          git checkout --quiet -B main origin/main
          cp build/appcast/appcast.xml site/appcast.xml
          if git diff --quiet -- site/appcast.xml; then
            echo "The tracked appcast already describes this release"
            exit 0
          fi
          git add site/appcast.xml
          git commit -q -m "chore(build): record the appcast for ${GITHUB_REF_NAME}"
          git push --quiet origin main

      # The release notes are this version's section of CHANGELOG.md, not a
      # second text written somewhere else. Generated notes listed commit
      # subjects — the `chore(build)` bump and every refactor among them — which
      # is noise to someone deciding whether to update.
      - name: Take the release notes from the changelog
        run: ./scripts/changelog-section.sh "${GITHUB_REF_NAME#v}" > build/release-notes.md

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/OpenBeam.dmg
            build/OpenBeam-*.zip
          body_path: build/release-notes.md

  # Publishes the site with the appcast this release just produced. Sparkle
  # cannot see the new version until this runs.
  pages:
    needs: build
    uses: ./.github/workflows/pages.yml
    with:
      appcast-artifact: appcast
    permissions:
      contents: read
      pages: write
      id-token: write
