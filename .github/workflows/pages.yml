name: Pages

# Deploys the landing page, the docs and the Sparkle appcast as one site.
#
# This is called by release.yml rather than triggered by `on: release`, because
# a release created with GITHUB_TOKEN does not trigger workflow runs — an
# `on: release` deploy would simply never fire.
on:
  workflow_call:
    inputs:
      appcast-artifact:
        description: >-
          Name of an artifact from the calling run holding a freshly generated
          appcast.xml, so a release publishes its feed without waiting for the
          commit that records it. When absent, the feed tracked in the
          repository is deployed unchanged.
        required: false
        type: string
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            site/landing/package-lock.json
            site/docs/package-lock.json

      # The two sites share nothing, so the job should not pay for them in
      # series — that is two installs and two builds on every deploy.
      - name: Build the landing page and the docs
        run: |
          (cd site/landing && npm ci && npm run build) &
          landing=$!
          (cd site/docs && npm ci && npm run build) &
          docs=$!
          wait $landing
          wait $docs

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -R site/landing/dist/. _site/
          mkdir -p _site/docs
          cp -R site/docs/dist/. _site/docs/

      - name: Take the new appcast from the release
        if: inputs.appcast-artifact != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.appcast-artifact }}
          path: _site

      - name: Take the published appcast from the repository
        if: inputs.appcast-artifact == ''
        run: |
          # A docs-only deploy replaces the whole site, so it has to bring the
          # feed with it or every installed copy would stop seeing updates.
          #
          # It used to fetch the live one back over HTTP, which has two ways of
          # being wrong and no way of noticing either: the site is served
          # through a CDN with a ten-minute cache, and when a release's push
          # also touches site/** there are two deploys of the same commit, so
          # the fetch can return the feed from before the release. Both were
          # measured on v2.4.0. The copy in the repository is neither stale nor
          # racing anything.
          test -f site/appcast.xml \
            || { echo "::error::site/appcast.xml is missing; refusing to deploy a site without an update feed"; exit 1; }
          cp site/appcast.xml _site/appcast.xml
          echo "Deploying the tracked appcast ($(grep -c '<item>' _site/appcast.xml) items)"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
